
name: Build blu_spark r277 Kernel with KernelSU-Next

on:
  workflow_dispatch: # Allows manual trigger via the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Clean Disk and Verify Space
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          df -h
          df -i

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Clone blu_spark r277 Kernel Source (Android 17)
        run: |
          git clone https://github.com/engstk/op8 --depth=1 -b blu_spark-17-custom kernel-source

      - name: Integrate KernelSU-Next (Official Legacy Kprobe Script)
        run: |
          cd kernel-source

          # 1. Run the official setup script pointing to the legacy branch
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          # 2. Remove existing Kprobe and KernelSU configuration entries
          sed -i '/CONFIG_KPROBES/d' arch/arm64/configs/blu_spark_defconfig
          sed -i '/CONFIG_KPROBE_EVENTS/d' arch/arm64/configs/blu_spark_defconfig
          sed -i '/CONFIG_KSU/d' arch/arm64/configs/blu_spark_defconfig

          # 3. Append required hooks and module subsystems
          echo "CONFIG_MODULES=y" >> arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU_KPROBE_HOOKS=y" >> arch/arm64/configs/blu_spark_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/blu_spark_defconfig

      - name: Download Proton Clang Toolchain
        run: |
          git clone https://github.com/kdrag0n/proton-clang --depth=1 tc

      
      - name: Build Kernel
        run: |
          cd kernel-source

          # Set architecture
          export ARCH=arm64
          export SUBARCH=arm64

          # Toolchain paths
          export PATH="$GITHUB_WORKSPACE/tc/bin:/usr/bin:/bin"

          # Use native Ubuntu tools for host executables
          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++
          export HOSTLD=/usr/bin/ld
          export HOSTLDFLAGS=""

          # Android kernel cross-compilation tools
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld

          # Verify the host linker
          /usr/bin/ld --version
          /usr/bin/gcc --version

          # Configure kernel
          make O=out vendor/blu_spark_defconfig

          # Build kernel using all available cores
          make -j"$(nproc --all)" O=out \
            HOSTCC=/usr/bin/gcc \
            HOSTCXX=/usr/bin/g++ \
            HOSTLD=/usr/bin/ld


      - name: Package Into AnyKernel3 Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AK3

          # Copy compiled kernel image
          cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AK3/

          # Disable strict device validation
          cd AK3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../blu_spark_r277_KSU_Next.zip *

      - name: Upload Flashable Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu_spark-r277-KernelSU-Next
          path: blu_spark_r277_KSU_Next.zip

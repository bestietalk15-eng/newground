
name: Build blu_spark r277 Kernel with KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Clean Disk and Verify Space
        run: |
          set -e
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          df -h
          df -i

      - name: Install Build Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib \
            git gnupg gperf \
            lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python3

      - name: Install ARM Cross-Compilers
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version

      - name: Clone blu_spark r277 Kernel Source
        run: |
          set -e
          git clone \
            https://github.com/engstk/op8 \
            --depth=1 \
            -b blu_spark-17-custom \
            kernel-source

          test -f kernel-source/arch/arm64/configs/blu_spark_defconfig

      - name: Integrate KernelSU-Next
        run: |
          set -e
          cd kernel-source

          curl -fLSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            -o /tmp/kernelsu-setup.sh

          bash /tmp/kernelsu-setup.sh legacy

          DEFCONFIG=arch/arm64/configs/blu_spark_defconfig

          sed -i \
            -e '/^CONFIG_KPROBES=/d' \
            -e '/^CONFIG_KPROBE_EVENTS=/d' \
            -e '/^CONFIG_KSU=/d' \
            -e '/^CONFIG_KSU_KPROBE_HOOKS=/d' \
            -e '/^# CONFIG_KPROBES is not set/d' \
            -e '/^# CONFIG_KPROBE_EVENTS is not set/d' \
            -e '/^# CONFIG_KSU is not set/d' \
            "$DEFCONFIG"

          cat >> "$DEFCONFIG" <<'EOF'

          CONFIG_MODULES=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_KPROBE_HOOKS=y
          CONFIG_KSU=y
          EOF

      - name: Download Proton Clang Toolchain
        run: |
          set -e
          git clone \
            https://github.com/kdrag0n/proton-clang \
            --depth=1 \
            tc

          test -x "$GITHUB_WORKSPACE/tc/bin/clang"
          test -x "$GITHUB_WORKSPACE/tc/bin/ld.lld"

      - name: Verify Toolchain
        run: |
          set -e

          echo "Host GCC:"
          /usr/bin/gcc --version

          echo "Host linker:"
          /usr/bin/ld --version

          echo "Proton Clang:"
          "$GITHUB_WORKSPACE/tc/bin/clang" --version

          echo "Proton LLD:"
          "$GITHUB_WORKSPACE/tc/bin/ld.lld" --version

          echo "ARM64 cross-compiler:"
          aarch64-linux-gnu-gcc --version

          echo "ARM32 cross-compiler:"
          arm-linux-gnueabi-gcc --version

      - name: Configure Kernel
        run: |
          set -e
          cd kernel-source

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="/usr/bin:/bin:$GITHUB_WORKSPACE/tc/bin"

          make O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC="$GITHUB_WORKSPACE/tc/bin/clang" \
            LD="$GITHUB_WORKSPACE/tc/bin/ld.lld" \
            HOSTCC=/usr/bin/gcc \
            HOSTCXX=/usr/bin/g++ \
            HOSTLD=/usr/bin/ld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            blu_spark_defconfig

      - name: Build Kernel
        run: |
          set -e
          cd kernel-source

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="/usr/bin:/bin:$GITHUB_WORKSPACE/tc/bin"

          CLANG="$GITHUB_WORKSPACE/tc/bin/clang"
          LLD="$GITHUB_WORKSPACE/tc/bin/ld.lld"

          # Prevent unknown Clang warning flags from being fatal.
          export KCFLAGS="-Wno-unknown-warning-option"
          export HOSTCFLAGS="-Wno-unknown-warning-option"

          # Show compiler versions and effective compatibility flags.
          "$CLANG" --version
          echo "KCFLAGS=$KCFLAGS"
          echo "HOSTCFLAGS=$HOSTCFLAGS"

          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC="$CLANG" \
            LD="$LLD" \
            HOSTCC=/usr/bin/gcc \
            HOSTCXX=/usr/bin/g++ \
            HOSTLD=/usr/bin/ld \
            HOSTCFLAGS="$HOSTCFLAGS" \
            KCFLAGS="$KCFLAGS" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "Checking kernel output..."
          find out/arch/arm64/boot \
            -maxdepth 1 -type f -name 'Image*' -print

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "KERNEL_IMAGE=Image.gz-dtb" >> "$GITHUB_ENV"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "KERNEL_IMAGE=Image.gz" >> "$GITHUB_ENV"
          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "KERNEL_IMAGE=Image" >> "$GITHUB_ENV"
          else
            echo "ERROR: No recognized kernel image was produced."
            exit 1
          fi

      - name: Package Into AnyKernel3 Zip
        run: |
          set -e

          git clone \
            https://github.com/osm0sis/AnyKernel3 \
            --depth=1 \
            AK3

          cp \
            "kernel-source/out/arch/arm64/boot/$KERNEL_IMAGE" \
            AK3/

          cd AK3

          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh

          zip -r9 ../blu_spark_r277_KSU_Next.zip . \
            -x '.git/*' \
            -x '.github/*'

      - name: Upload Flashable Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu_spark-r277-KernelSU-Next
          path: blu_spark_r277_KSU_Next.zip
          if-no-files-found: error

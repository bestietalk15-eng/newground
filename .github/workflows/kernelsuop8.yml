name: Build blu_spark r277 Kernel with KernelSU-Next

on:
  workflow_dispatch: # Allows manual trigger via the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Clone blu_spark r277 Kernel Source (Android 17)
        run: |
          git clone https://github.com/engstk/op8 --depth=1 -b blu_spark-17-custom kernel-source

      - name: Integrate KernelSU-Next (Non-GKI Manual Hook Method)
        run: |
          cd kernel-source
          git clone https://github.com/KernelSU-Next/KernelSU-Next KernelSU

          python3 KernelSU/scripts/integrate-no-kprobe.py arch/arm64/configs/vendor/blu_spark_defconfig

          echo "CONFIG_KPROBES=n" >> arch/arm64/configs/vendor/blu_spark_defconfig
          echo "CONFIG_HAVE_KPROBES=n" >> arch/arm64/configs/vendor/blu_spark_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/blu_spark_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/vendor/blu_spark_defconfig

      - name: Download Proton Clang Toolchain
        run: |
          git clone https://github.com/kdrag0n/proton-clang --depth=1 tc

      - name: Build Kernel
        run: |
          cd kernel-source
          export PATH=$GITHUB_WORKSPACE/tc/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang

          make O=out vendor/blu_spark_defconfig
          make -j$(nproc --all) O=out

      - name: Package Into AnyKernel3 Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AK3

          cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AK3/

          cd AK3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../blu_spark_r277_KSU_Next.zip *

      - name: Upload Flashable Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu_spark-r277-KernelSU-Next
          path: blu_spark_r277_KSU_Next.zip


name: Build blu_spark r277 Kernel with KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Clean Disk and Verify Space
        run: |
          set -e
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          df -h
          df -i

      - name: Install Build Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            gcc g++ \
            git gnupg gperf \
            liblz4-tool libncurses-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python3 \
            gcc-aarch64-linux-gnu

      - name: Verify Host and ARM64 Cross-Compiler
        run: |
          set -e

          echo "Ubuntu version:"
          cat /etc/os-release

          echo "Host GCC:"
          /usr/bin/gcc --version

          echo "Host G++:"
          /usr/bin/g++ --version

          echo "Host linker:"
          /usr/bin/ld --version

          echo "ARM64 cross-compiler:"
          aarch64-linux-gnu-gcc --version

          echo "Available disk space:"
          df -h

      - name: Clone blu_spark Kernel Source
        run: |
          set -e

          git clone \
            --depth=1 \
            -b blu_spark-17-custom \
            https://github.com/engstk/op8 \
            kernel-source

          test -f kernel-source/Makefile
          test -f kernel-source/arch/arm64/configs/blu_spark_defconfig

          cd kernel-source

          echo "Kernel source Makefile:"
          head -n 10 Makefile

          echo "Kernel configuration:"
          ls -l arch/arm64/configs/blu_spark_defconfig

      - name: Integrate KernelSU-Next
        run: |
          set -e
          cd kernel-source

          curl -fLSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            -o /tmp/kernelsu-setup.sh

          bash /tmp/kernelsu-setup.sh legacy

          echo "Checking KernelSU-Next integration..."
          test -d KernelSU-Next

          DEFCONFIG=arch/arm64/configs/blu_spark_defconfig

          sed -i \
            -e '/^CONFIG_KPROBES=/d' \
            -e '/^CONFIG_KPROBE_EVENTS=/d' \
            -e '/^CONFIG_KSU=/d' \
            -e '/^CONFIG_KSU_KPROBE_HOOKS=/d' \
            -e '/^# CONFIG_KPROBES is not set/d' \
            -e '/^# CONFIG_KPROBE_EVENTS is not set/d' \
            -e '/^# CONFIG_KSU is not set/d' \
            "$DEFCONFIG"

          cat >> "$DEFCONFIG" <<'EOF'

          CONFIG_MODULES=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_KPROBE_HOOKS=y
          CONFIG_KSU=y
          EOF

          echo "KernelSU-Next integration completed."

      - name: Fix Unsupported Clang Warning Flag
        run: |
          set -e
          cd kernel-source

          echo "Searching for the unsupported warning flag..."
          grep -n -- '-Wno-unused-but-set-variable' Makefile || true

          if grep -q -- '-Wno-unused-but-set-variable' Makefile; then
            sed -i \
              's/-Wno-unused-but-set-variable//g' \
              Makefile
          fi

          if grep -q -- '-Wno-unused-but-set-variable' Makefile; then
            echo "ERROR: Unsupported flag remains in the top-level Makefile."
            exit 1
          fi

          echo "Checking whether the flag occurs elsewhere..."
          grep -R -n \
            --include='Makefile' \
            --include='*.mk' \
            -- '-Wno-unused-but-set-variable' \
            . || true

      - name: Download Proton Clang
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/kdrag0n/proton-clang \
            tc

          test -x "$GITHUB_WORKSPACE/tc/bin/clang"
          test -x "$GITHUB_WORKSPACE/tc/bin/ld.lld"

          echo "Proton Clang version:"
          "$GITHUB_WORKSPACE/tc/bin/clang" --version

          echo "Proton LLD version:"
          "$GITHUB_WORKSPACE/tc/bin/ld.lld" --version

      - name: Configure Kernel
        run: |
          set -e
          cd kernel-source

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="/usr/bin:/bin:$GITHUB_WORKSPACE/tc/bin"

          CLANG="$GITHUB_WORKSPACE/tc/bin/clang"
          LLD="$GITHUB_WORKSPACE/tc/bin/ld.lld"

          make O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC="$CLANG" \
            LD="$LLD" \
            HOSTCC=/usr/bin/gcc \
            HOSTCXX=/usr/bin/g++ \
            HOSTLD=/usr/bin/ld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            blu_spark_defconfig

          echo "Checking generated configuration..."
          test -f out/.config

          grep -E \
            'CONFIG_(MODULES|KPROBES|KPROBE_EVENTS|KSU)=' \
            out/.config || true

          echo "Checking ARM32 compatibility configuration..."
          grep -E \
            'CONFIG_(COMPAT|COMPAT_VDSO)=' \
            out/.config || true

      - name: Build Kernel
        run: |
          set -e
          cd kernel-source

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="/usr/bin:/bin:$GITHUB_WORKSPACE/tc/bin"

          CLANG="$GITHUB_WORKSPACE/tc/bin/clang"
          LLD="$GITHUB_WORKSPACE/tc/bin/ld.lld"

          echo "Compiler:"
          "$CLANG" --version

          echo "ARM64 cross-compiler:"
          aarch64-linux-gnu-gcc --version

          echo "Starting kernel build..."

          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC="$CLANG" \
            LD="$LLD" \
            HOSTCC=/usr/bin/gcc \
            HOSTCXX=/usr/bin/g++ \
            HOSTLD=/usr/bin/ld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "Kernel build completed."
          echo "Searching for kernel images..."

          find out/arch/arm64/boot \
            -maxdepth 1 \
            -type f \
            -name 'Image*' \
            -print

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "KERNEL_IMAGE=Image.gz-dtb" >> "$GITHUB_ENV"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "KERNEL_IMAGE=Image.gz" >> "$GITHUB_ENV"
          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "KERNEL_IMAGE=Image" >> "$GITHUB_ENV"
          else
            echo "ERROR: No recognized kernel image was produced."
            exit 1
          fi

          echo "Selected image: $KERNEL_IMAGE"

      - name: Package Into AnyKernel3
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3 \
            AK3

          test -n "$KERNEL_IMAGE"

          SOURCE_IMAGE="kernel-source/out/arch/arm64/boot/$KERNEL_IMAGE"

          if [ ! -f "$SOURCE_IMAGE" ]; then
            echo "ERROR: Kernel image not found: $SOURCE_IMAGE"
            exit 1
          fi

          cp "$SOURCE_IMAGE" AK3/

          cd AK3

          sed -i \
            's/do.devicecheck=1/do.devicecheck=0/g' \
            anykernel.sh

          zip -r9 ../blu_spark_r277_KSU_Next.zip . \
            -x '.git/*' \
            -x '.github/*'

          cd ..

          test -s blu_spark_r277_KSU_Next.zip

          echo "Flashable ZIP created:"
          ls -lh blu_spark_r277_KSU_Next.zip

      - name: Upload Flashable Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu_spark-r277-KernelSU-Next
          path: blu_spark_r277_KSU_Next.zip
          if-no-files-found: error

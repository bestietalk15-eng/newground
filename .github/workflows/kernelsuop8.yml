
name: Build blu_spark r277 Kernel with KernelSU-Next

on:
  workflow_dispatch: # Allows manual trigger via the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Clean Disk and Verify Space
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          df -h
          df -i

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
            git gnupg gperf lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python3

      - name: Clone blu_spark r277 Kernel Source
        run: |
          git clone https://github.com/engstk/op8 --depth=1 -b blu_spark-17-custom kernel-source

      - name: Integrate KernelSU-Next (Official Legacy Kprobe Script)
        run: |
          set -e
          cd kernel-source

          # Integrate KernelSU-Next using the legacy setup
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          # Remove existing Kprobe and KernelSU configuration entries
          sed -i '/CONFIG_KPROBES/d' arch/arm64/configs/blu_spark_defconfig
          sed -i '/CONFIG_KPROBE_EVENTS/d' arch/arm64/configs/blu_spark_defconfig
          sed -i '/CONFIG_KSU/d' arch/arm64/configs/blu_spark_defconfig

          # Append required configuration options
          cat >> arch/arm64/configs/blu_spark_defconfig <<'EOF'
          CONFIG_MODULES=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_KPROBE_HOOKS=y
          CONFIG_KSU=y
          EOF

      - name: Download Proton Clang Toolchain
        run: |
          git clone https://github.com/kdrag0n/proton-clang --depth=1 tc

      - name: Build Kernel
        run: |
          set -e
          cd kernel-source

          # Architecture
          export ARCH=arm64
          export SUBARCH=arm64

          # Prefer Ubuntu native host tools
          export PATH="/usr/bin:/bin:$GITHUB_WORKSPACE/tc/bin"

          # Native host compilation
          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++
          export HOSTLD=/usr/bin/ld

          # Cross-compilers
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Clang toolchain
          export CC=clang
          export LD=ld.lld

          # Verify tools
          echo "Host linker:"
          /usr/bin/ld --version

          echo "Host compiler:"
          /usr/bin/gcc --version

          echo "ARM64 cross-compiler:"
          aarch64-linux-gnu-gcc --version

          echo "ARM32 cross-compiler:"
          arm-linux-gnueabi-gcc --version

          echo "Clang:"
          clang --version

          echo "LLD:"
          ld.lld --version

          # Generate configuration from the correct defconfig
          make O=out \
            HOSTCC=/usr/bin/gcc \
            HOSTCXX=/usr/bin/g++ \
            HOSTLD=/usr/bin/ld \
            blu_spark_defconfig

          # Compile the kernel
          make -j"$(nproc --all)" O=out \
            CC=clang \
            HOSTCC=/usr/bin/gcc \
            HOSTCXX=/usr/bin/g++ \
            HOSTLD=/usr/bin/ld

      - name: Package Into AnyKernel3 Zip
        run: |
          set -e

          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AK3

          # Copy the compiled kernel image
          cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AK3/

          # Disable strict device validation
          cd AK3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh

          # Create flashable ZIP
          zip -r9 ../blu_spark_r277_KSU_Next.zip .

      - name: Upload Flashable Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu_spark-r277-KernelSU-Next
          path: blu_spark_r277_KSU_Next.zip
          if-no-files-found: error
